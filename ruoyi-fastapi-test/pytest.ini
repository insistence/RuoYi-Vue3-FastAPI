[pytest]
testpaths = .
norecursedirs = node_modules target .cache frontend time-contract
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --strict-markers
markers =
    smoke: Core login, authorization, page loading and timezone checks.
    e2e: Tests requiring an isolated running application and database.
    harness: Local test infrastructure checks without application services.
