name: Plugin Frontend Tests

on:
  push:
    branches: [master]
    paths:
      - 'ruoyi-fastapi-frontend/src/api/system/plugin.js'
      - 'ruoyi-fastapi-frontend/src/components/PluginFrame/**'
      - 'ruoyi-fastapi-frontend/src/views/system/plugin/**'
      - 'ruoyi-fastapi-frontend/src/utils/**'
      - 'ruoyi-fastapi-frontend/src/plugins/**'
      - 'ruoyi-fastapi-frontend/src/router/**'
      - 'ruoyi-fastapi-frontend/src/store/modules/permission.js'
      - 'ruoyi-fastapi-frontend/src/store/modules/user.js'
      - 'ruoyi-fastapi-frontend/src/permission.js'
      - 'ruoyi-fastapi-frontend/plugins/**'
      - 'ruoyi-fastapi-frontend/tests/plugins/**'
      - 'ruoyi-fastapi-frontend/tests/run-tests.js'
      - 'ruoyi-fastapi-frontend/package.json'
      - 'ruoyi-fastapi-frontend/package-lock.json'
      - 'ruoyi-fastapi-frontend/vite.config.js'
      - 'ruoyi-fastapi-frontend/vite/**'
      - 'ruoyi-fastapi-backend/plugins/examples/python/bundle_demo/web/**'
      - '.github/workflows/plugin-frontend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ruoyi-fastapi-frontend/src/api/system/plugin.js'
      - 'ruoyi-fastapi-frontend/src/components/PluginFrame/**'
      - 'ruoyi-fastapi-frontend/src/views/system/plugin/**'
      - 'ruoyi-fastapi-frontend/src/utils/**'
      - 'ruoyi-fastapi-frontend/src/plugins/**'
      - 'ruoyi-fastapi-frontend/src/router/**'
      - 'ruoyi-fastapi-frontend/src/store/modules/permission.js'
      - 'ruoyi-fastapi-frontend/src/store/modules/user.js'
      - 'ruoyi-fastapi-frontend/src/permission.js'
      - 'ruoyi-fastapi-frontend/plugins/**'
      - 'ruoyi-fastapi-frontend/tests/plugins/**'
      - 'ruoyi-fastapi-frontend/tests/run-tests.js'
      - 'ruoyi-fastapi-frontend/package.json'
      - 'ruoyi-fastapi-frontend/package-lock.json'
      - 'ruoyi-fastapi-frontend/vite.config.js'
      - 'ruoyi-fastapi-frontend/vite/**'
      - 'ruoyi-fastapi-backend/plugins/examples/python/bundle_demo/web/**'
      - '.github/workflows/plugin-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ruoyi-fastapi-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ruoyi-fastapi-frontend/package.json
      - name: Install frontend dependencies
        # This repository does not commit npm lockfiles, so npm ci is not available.
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify plugin bridge, sessions and management views
        run: npm run test:plugin
