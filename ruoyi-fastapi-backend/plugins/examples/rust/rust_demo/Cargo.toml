[package]
name = "ruoyi-plugin-rust-demo"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
