[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ruoyi-plugin-rust-demo"
version = "1.0.0"
requires-python = ">=3.10"
description = "RuoYi native ASGI plugin example"

[tool.maturin]
python-source = "python"
module-name = "ruoyi_plugin_rust_demo._native"
bindings = "pyo3"
